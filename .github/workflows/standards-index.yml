name: Standards index validation
on:
  pull_request:
  push:
    branches: [main, 'fix/medrps-authority-chain']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standards-index:
    name: Mallow Standards Index
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run standards:check
